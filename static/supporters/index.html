<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>若梦兔 RMT · 支持者星空</title>
<link rel="icon" type="image/png" href="../img/rmt-logo.png">
<style>
:root{--bg:#071008;--cyan:#4ffcff;--purple:#7cff8b;--pink:#ff65c8;--text:#f7ffe9;--muted:#9caf86}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:
linear-gradient(118deg,transparent 28%,rgba(95,255,230,.035) 44%,rgba(255,100,205,.045) 51%,transparent 67%),
radial-gradient(circle at 50% 48%,rgba(50,255,200,.10),transparent 35%),
radial-gradient(circle at 15% 20%,rgba(61,255,143,.10),transparent 28%),
radial-gradient(circle at 85% 80%,rgba(255,72,190,.09),transparent 30%);pointer-events:none}
#stars,#meteors{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#stars{opacity:.72}#meteors{z-index:1}
.wrap{position:relative;height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:26px 36px;z-index:2}
header{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#57ffe1,#70ff94 52%,#ff65c8);color:#14200a;box-shadow:0 0 35px #49ffd655}.logo img{display:block;width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 6px #8affb8aa)}
h1{font-size:18px;margin:0;letter-spacing:2px}.sub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:3px}
.stats{font-size:12px;color:#a9bdd6;background:#ffffff08;border:1px solid #ffffff14;padding:10px 14px;border-radius:999px;backdrop-filter:blur(12px)}
.header-status{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.audio-unmute{display:none;width:44px;height:40px;border:1px solid #62ffe178;border-radius:999px;background:#071710e8;color:#dffff6;padding:0;font:20px/1 "Segoe UI Emoji","Segoe UI Symbol",sans-serif;box-shadow:0 8px 22px #0006;cursor:pointer;touch-action:manipulation}
.audio-unmute.visible{display:block}
.audio-unmute.playing{cursor:default;border-color:#62ffe13d;color:#9fffea}
.stage{position:relative;display:grid;place-items:center;min-height:0}
.orbit{position:absolute;width:min(58vw,58vh);aspect-ratio:1;border-radius:50%;border:1px solid #55ffe51d;box-shadow:inset 0 0 90px #4fffd009,0 0 90px #ff5ac80c}
.orbit:before,.orbit:after{content:"";position:absolute;inset:8%;border:1px solid #ff67cb18;border-radius:50%;transform:rotateX(68deg)}
.orbit:after{transform:rotateY(68deg)}
.globe{position:relative;width:min(68vw,68vh);aspect-ratio:1;perspective:900px;cursor:grab;user-select:none;touch-action:none}
.globe:active{cursor:grabbing}.sphere{position:absolute;inset:0;transform-style:preserve-3d}
.person{--star-color:#5effd7;position:absolute;left:50%;top:50%;transform-style:preserve-3d;white-space:nowrap;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--star-color);text-shadow:0 0 12px color-mix(in srgb,var(--star-color) 65%,transparent);transition:color .25s,text-shadow .25s,opacity .25s}
.person.active{color:#fff;text-shadow:0 0 8px #fff,0 0 22px var(--star-color),0 0 42px var(--star-color);font-size:16px;z-index:10}
.supporter-bubble{position:absolute;left:50%;bottom:calc(100% + 12px);width:max-content;max-width:min(260px,62vw);padding:9px 12px;border:1px solid color-mix(in srgb,var(--star-color) 62%,white 8%);border-radius:12px;background:#07120ff2;color:#f4fff9;font-size:12px;font-weight:600;line-height:1.5;letter-spacing:.2px;white-space:normal;text-align:left;box-shadow:0 8px 30px #000a,0 0 20px color-mix(in srgb,var(--star-color) 34%,transparent);pointer-events:none;opacity:0;transform:translate(-50%,7px) scale(.94);transition:opacity .18s,transform .18s;z-index:200}
.supporter-bubble:after{content:"";position:absolute;left:50%;top:100%;width:8px;height:8px;background:#07120ff2;border-right:1px solid var(--star-color);border-bottom:1px solid var(--star-color);transform:translate(-50%,-4px) rotate(45deg)}
.supporter-bubble.visible{opacity:1;transform:translate(-50%,0) scale(1)}
.core{position:absolute;left:50%;top:50%;width:145px;height:145px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#dfffff,#64ecff 15%,#785dff 42%,#1c155d 65%,#050713 73%);box-shadow:0 0 25px #6cf,0 0 80px #7a5fff99,0 0 150px #ff64c933;animation:pulse 3s ease-in-out infinite;pointer-events:none}
.core:after{content:"RMT";position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:1000;letter-spacing:4px;color:white;text-shadow:0 0 20px #fff}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06);filter:hue-rotate(20deg)}}
.card{position:fixed;right:28px;bottom:28px;top:auto;transform:none;width:min(370px,calc(100vw - 40px));z-index:8;padding:54px 22px 22px;border-radius:22px;background:linear-gradient(135deg,#10172dcc,#0b0d1ecc);border:1px solid #58ffe228;box-shadow:0 20px 70px #0008, inset 0 0 35px #58ffe208;backdrop-filter:blur(18px);transition:width .2s,padding .2s}
.card-toggle{position:absolute;right:14px;top:13px;min-width:66px;height:30px;border:1px solid #62ffe13b;border-radius:10px;background:#071710dc;color:#9fffea;font:700 12px/1 "Microsoft YaHei",sans-serif;cursor:pointer;touch-action:manipulation}
.card-toggle:hover,.card-toggle:focus-visible{border-color:#62ffe19c;background:#123128;outline:none}
.card.collapsed{width:auto;padding:12px}
.card.collapsed .card-content{display:none}
.card.collapsed .card-toggle{position:static}
.card .tag{font-size:10px;letter-spacing:3px;color:var(--cyan)}.card h2{font-size:28px;margin:10px 0 4px}.time{font-size:12px;color:var(--muted)}
.note{margin-top:18px;min-height:76px;font-size:16px;line-height:1.7;color:#dfeaff;padding:15px;border-radius:14px;background:#ffffff07;border-left:2px solid var(--cyan)}
.note.empty{color:#64758e;font-style:italic}
footer{display:flex;justify-content:center;color:#62738d;font-size:11px;letter-spacing:1px;padding-bottom:3px}
.hint{position:absolute;left:3%;top:50%;transform:translateY(-50%);font-size:11px;color:#687c99;line-height:2}
@media(max-width:850px){.wrap{padding:18px}.card{right:14px;bottom:14px;top:auto;transform:none;width:min(92vw,420px)}.globe{width:min(82vw,50vh)}.hint{display:none}.stats{display:none}}

.stage:before,.stage:after{content:"";position:absolute;left:50%;top:50%;width:min(64vw,64vh);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) rotate(-12deg) scaleY(.27);border:1px solid #54ffe520;box-shadow:0 0 35px #4fffe00a;pointer-events:none}
.stage:after{width:min(56vw,56vh);transform:translate(-50%,-50%) rotate(37deg) scaleY(.18);border-color:#ff64ca20}
.person:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--star-color);left:-9px;top:50%;box-shadow:0 0 10px var(--star-color)}


.searchbox{position:relative;display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:17px}
.searchbox input{min-width:0;border:1px solid #62ffe12b;background:#06120fd9;color:#eaffff;padding:11px 12px;border-radius:12px;outline:none;font-size:12px;box-shadow:inset 0 0 18px #43ffd608}
.searchbox input:focus{border-color:#5affe18a;box-shadow:0 0 20px #45ffd31c,inset 0 0 18px #43ffd608}
.searchbox button{border:1px solid #ff69c83d;background:linear-gradient(135deg,#40dcb522,#ff5fc622);color:#eaffff;border-radius:12px;padding:0 14px;cursor:pointer}
.searchResults{position:absolute;left:0;right:0;top:48px;max-height:210px;overflow:auto;background:#06100ff2;border:1px solid #58ffe22e;border-radius:13px;backdrop-filter:blur(18px);display:none;z-index:30;box-shadow:0 18px 50px #000b}
.result{padding:10px 12px;border-bottom:1px solid #ffffff0b;cursor:pointer;font-size:11px;color:#b8d8d2}
.result:hover{background:#53ffda12;color:#fff}.result b{color:#63ffe1;font-size:12px}.result em{color:#ff78cf;font-style:normal;margin-left:7px}
#stars{filter:drop-shadow(0 0 3px #58ffe266)}





/* ===== Mobile optimization ===== */
@media(max-width:850px){
 html,body{overflow:hidden;height:100%;height:100dvh;-webkit-text-size-adjust:100%}
 .wrap{height:100vh;height:100dvh;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));grid-template-rows:auto 1fr}
 header{align-items:flex-start}
 .brand{gap:9px}.logo{width:36px;height:36px;border-radius:11px;font-size:13px}.logo img{width:24px;height:24px}
 h1{font-size:14px;letter-spacing:1px}.sub{font-size:8px;letter-spacing:1.4px;margin-top:2px}
 header{gap:8px}.brand{min-width:0}.brand>div:last-child{min-width:0}
 h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .header-status{flex:none;gap:5px}.stats{display:block;white-space:nowrap;padding:7px 9px;font-size:10px}
 .audio-unmute{width:40px;height:36px;font-size:18px}
 .stage{min-height:0;overflow:visible}
 .globe{width:min(98vw,58dvh);height:min(98vw,58dvh);position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);perspective:700px}
 .orbit{width:min(102vw,60dvh);left:50%;top:42%;transform:translate(-50%,-50%)}
 .stage:before,.stage:after{left:50%;top:42%;width:min(104vw,62dvh)}
 .person{font-size:10px;text-shadow:0 0 5px #58ffe680}
 .person.active{font-size:13px}

 .card{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));width:auto;max-height:35dvh;padding:12px 14px 13px;border-radius:16px;overflow:visible;backdrop-filter:blur(8px)}
 /* 手机上把收起按钮放回正常文档流，避免小屏时遮住搜索框。 */
 .card-toggle{position:relative;right:auto;top:auto;display:block;margin-left:auto;min-width:82px;height:44px;font-size:12px}
 .card-content{margin-top:10px}
 .card.collapsed{left:auto;right:12px;width:auto;padding:8px}
 .card.collapsed .card-toggle{margin:0;min-width:82px}
 .card .tag{font-size:8px;letter-spacing:2px}
 .card h2{font-size:20px;margin:7px 0 2px}
 .time{font-size:10px}.note{margin-top:9px;min-height:0;max-height:70px;overflow:auto;font-size:12px;line-height:1.5;padding:9px 10px;border-radius:10px}
 .searchbox{margin-bottom:10px;gap:6px}.searchbox input{min-height:44px;padding:9px 10px;font-size:16px}.searchbox button{min-height:44px;padding:0 14px}
 .searchResults{top:auto;bottom:43px;max-height:31dvh}.result{padding:8px 10px;font-size:10px}.result b{font-size:11px}
 footer{display:none}
}
@media(max-width:430px){
 .globe{width:min(106vw,55dvh);height:min(106vw,55dvh);top:40%}
 .orbit{width:min(110vw,57dvh);top:40%}
 .stage:before,.stage:after{width:min(112vw,59dvh);top:40%}
 .card{left:9px;right:9px;bottom:max(9px,env(safe-area-inset-bottom));padding:10px 12px}
 .note{max-height:58px}
}
@media(max-height:650px) and (max-width:850px){
 .sub{display:none}.logo{width:32px;height:32px}.logo img{width:21px;height:21px}.globe{top:37%;width:min(92vw,55dvh);height:min(92vw,55dvh)}
 .orbit,.stage:before,.stage:after{top:37%}.card{max-height:38dvh}.note{max-height:45px}
}
@media(max-width:850px){
 /* 全屏滤镜会让手机 GPU 持续合成，移动端改为更轻的纯画布效果。 */
 #stars{filter:none}.core{box-shadow:0 0 18px #6cf,0 0 55px #7a5fff77,0 0 95px #ff64c922;animation:pulse-mobile 4s ease-in-out infinite}
}
@keyframes pulse-mobile{50%{transform:translate(-50%,-50%) scale(1.04)}}
@media(prefers-reduced-motion:reduce){.core{animation:none}}

<body>
<canvas id="stars"></canvas><canvas id="meteors"></canvas>
<audio id="backgroundMusic" src="./audio/background.mp3" preload="auto" loop playsinline></audio>
<div class="wrap">
<header><div class="brand"><div class="logo"><img src="../img/rmt-logo.png" alt="RMT 兔子图标"></div><div><h1>若梦兔 RMT · 支持者星空</h1><div class="sub">EVERY SUPPORT BECOMES A STAR</div></div></div><div class="header-status"><div class="stats" id="stats"></div><button class="audio-unmute" id="audioUnmute" type="button" aria-label="取消静音并播放音乐" title="取消静音并播放音乐">🔇</button></div></header>
<main class="stage">
<div class="orbit"></div>
<div class="globe" id="globe"><div class="sphere" id="sphere"></div></div>
<aside class="card" id="detailCard">
<button class="card-toggle" id="cardToggle" type="button" aria-expanded="true" aria-controls="cardContent">收起 ▲</button>
<div class="card-content" id="cardContent">
<div class="searchbox">
  <input id="searchInput" placeholder="搜索时间 / 名称 / 留言…" autocomplete="off">
  <button id="searchBtn">定位</button>
  <div id="searchResults" class="searchResults"></div>
</div>
<div class="tag">SUPPORTER SIGNAL</div><h2 id="name">感谢每一位支持者</h2><div class="time" id="time">RMT · SUPPORTER CONSTELLATION</div><div class="note" id="note">每一份支持，都让若梦兔走得更远。</div>
</div>
</aside>
</main>
<footer>RMT · 若梦兔 · 开源因热爱而开始，也因大家的支持走得更远</footer>
</div>
<script src="./supporters-data.js"></script>
<script>
// ============================================================
// 支持者名单由 supporters-data.js 提供，页面表现与数据分开维护。
// ============================================================
const supporters = Array.isArray(window.RMT_SUPPORTERS) ? window.RMT_SUPPORTERS : [];
// ============================================================

const sphere=document.getElementById('sphere'), globe=document.getElementById('globe');
const nameEl=document.getElementById('name'),timeEl=document.getElementById('time'),noteEl=document.getElementById('note');
const detailCard=document.getElementById('detailCard'),cardToggle=document.getElementById('cardToggle');
const audioUnmute=document.getElementById('audioUnmute');
document.getElementById('stats').textContent=`${supporters.length} 份支持 · 2025 — 2026`;

cardToggle.onclick=()=>{
  const collapsed=detailCard.classList.toggle('collapsed');
  cardToggle.textContent=collapsed?'展开 ▼':'收起 ▲';
  cardToggle.setAttribute('aria-expanded',String(!collapsed));
};

const supporterPalette=['#5effd7','#55d6ff','#7f9cff','#a987ff','#ff73bf','#ff9f68','#ffd166','#9bea72'];
function stableHash(value){
  let hash=2166136261;
  for(const char of String(value)){
    hash^=char.codePointAt(0);
    hash=Math.imul(hash,16777619);
  }
  return hash>>>0;
}
function supporterColor(s){
  // 只使用打赏时间作为种子，同一条记录每次打开、搜索和触发流星时颜色都一致。
  return supporterPalette[stableHash(`${s.year} ${s.time}`)%supporterPalette.length];
}

// 背景音乐保持原生 <audio> 输出，不依赖流星音效的 Web Audio 上下文。
// 这样移动端在首次交互后能稳定恢复背景音乐播放。
const backgroundMusic=document.getElementById('backgroundMusic');
const AudioContextClass=window.AudioContext||window.webkitAudioContext;
backgroundMusic.volume=.12;
let audioContext=null,audioMaster=null;
function ensureAudio(){
  if(!AudioContextClass)return null;
  if(!audioContext){
    audioContext=new AudioContextClass();
    audioMaster=audioContext.createGain();
    // 流星音效比背景音乐更清晰，避免在手机扬声器上几乎听不见。
    audioMaster.gain.value=.5;
    audioMaster.connect(audioContext.destination);
  }
  return audioContext;
}
function showMutedAudioControl(){
  audioUnmute.classList.add('visible');
  audioUnmute.classList.remove('playing');
  audioUnmute.disabled=false;
  audioUnmute.textContent='🔇';
  audioUnmute.setAttribute('aria-label','取消静音并播放音乐');
  audioUnmute.title='取消静音并播放音乐';
}
function showPlayingAudioControl(){
  audioUnmute.classList.add('visible','playing');
  audioUnmute.disabled=true;
  audioUnmute.textContent='🔊';
  audioUnmute.setAttribute('aria-label','背景音乐正在播放');
  audioUnmute.title='背景音乐正在播放';
}
async function activateAudio(showPlayingControl=false){
  // 先在用户手势的同步阶段请求播放，避免 iOS/Safari 在 await 之后丢失授权。
  const musicPromise=backgroundMusic.paused?backgroundMusic.play():Promise.resolve();
  const ctx=ensureAudio();
  const contextPromise=ctx&&ctx.state==='suspended'?ctx.resume():Promise.resolve();
  await Promise.all([musicPromise,contextPromise]);
  if(showPlayingControl)showPlayingAudioControl();
  else audioUnmute.classList.remove('visible');
}
function playMeteorSound(s){
  const ctx=audioContext;
  if(!ctx||ctx.state!=='running')return;
  // 流星出现后半秒再响起，音效总时长比原先增加 1 秒。
  const start=ctx.currentTime+.5;
  const duration=2.55;
  const seed=stableHash(`${s.year} ${s.time}`);
  const gain=ctx.createGain();
  const sweep=ctx.createOscillator();
  const sparkle=ctx.createOscillator();
  sweep.type='sine';sparkle.type='triangle';
  sweep.frequency.setValueAtTime(980+(seed%180),start);
  sweep.frequency.exponentialRampToValueAtTime(210+(seed%70),start+duration-0.1);
  sparkle.frequency.setValueAtTime(1320+(seed%240),start);
  sparkle.frequency.exponentialRampToValueAtTime(620,start+duration-0.45);
  gain.gain.setValueAtTime(.0001,start);
  gain.gain.exponentialRampToValueAtTime(.16,start+.06);
  gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
  sweep.connect(gain);sparkle.connect(gain);gain.connect(audioMaster);
  sweep.start(start);sparkle.start(start);sweep.stop(start+duration+.05);sparkle.stop(start+duration+.05);
}
function requestBackgroundMusic(showPlayingControl=false){
  activateAudio(showPlayingControl).catch(showMutedAudioControl);
}
// 先让页面首帧完成绘制，再立刻请求播放；不等待整页资源加载。
requestAnimationFrame(()=>requestAnimationFrame(requestBackgroundMusic));
// 音频缓冲完成时再试一次，避免首次请求早于可播放状态。
backgroundMusic.addEventListener('canplay',requestBackgroundMusic,{once:true});
for(const eventName of ['pointerdown','touchstart','keydown']){
  addEventListener(eventName,requestBackgroundMusic,{once:true,passive:true,capture:true});
}
audioUnmute.addEventListener('click',()=>requestBackgroundMusic(true));
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)requestBackgroundMusic();
});

// 自动朝向只由现实时间决定。两个互质周期覆盖完整经纬方向，
// 因而南北极与所有普通节点都有机会转到正前方；未人工操作时各客户端画面一致。
const AUTO_X_PERIOD=257000,AUTO_Y_PERIOD=173000,AUTO_BLEND_DURATION=850;
function timeOrientation(epochTime){
  return {
    // 纬向在 -89.5° 到 89.5° 之间往返，覆盖两极但不会把球体上下翻面。
    rx:89.5*Math.sin((epochTime%AUTO_X_PERIOD)/AUTO_X_PERIOD*Math.PI*2),
    ry:(epochTime%AUTO_Y_PERIOD)/AUTO_Y_PERIOD*360
  };
}
const initialOrientation=timeOrientation(Date.now());
let rx=initialOrientation.rx,ry=initialOrientation.ry,scale=1.08,drag=false,lx=0,ly=0,auto=true,autoTimer=0;
// 1 表示球体向右转，-1 表示向左转；流星据此选择左右对角线。
let sphereTurnDirection=1,lastAutoRy=initialOrientation.ry;
let autoBlendStarted=0,autoBlendFrom={rx,ry};
function shortestAngleDelta(from,to){return ((to-from+540)%360)-180}
function pauseAuto(){
  auto=false;
  if(autoTimer){clearTimeout(autoTimer);autoTimer=0}
}
function startAutoRotation(){
  if(autoTimer){clearTimeout(autoTimer);autoTimer=0}
  // 手动定位结束后，信息卡重新跟随球体正中央的支持者。
  selectedSupporterIndex=null;
  autoBlendFrom={rx,ry};
  autoBlendStarted=performance.now();
  auto=true;
}
function pauseAutoFor(delay){
  pauseAuto();
  autoTimer=setTimeout(()=>{
    if(!drag&&touches.size===0)startAutoRotation();
    autoTimer=0;
  },delay);
}
const nodes=[], N=supporters.length;
supporters.forEach((s,i)=>{
  const el=document.createElement('div'); el.className='person'; el.textContent=s.name;
  el.style.setProperty('--star-color',supporterColor(s));
  const y=1-(i/(Math.max(1,N-1)))*2, radius=Math.sqrt(1-y*y), theta=Math.PI*(3-Math.sqrt(5))*i;
  el.dataset.x=Math.cos(theta)*radius; el.dataset.y=y; el.dataset.z=Math.sin(theta)*radius;
  // 球体会捕获拖动指针；昵称单独拦截按下事件，保证点击能稳定刷新详情。
  el.addEventListener('pointerdown',event=>event.stopPropagation());
  el.addEventListener('click',event=>{
    event.stopPropagation();
    if(detailCard.classList.contains('collapsed'))return;
    selectSupporter(i);pauseAutoFor(10000);
  });
  sphere.appendChild(el); nodes.push(el);
});
let selectedSupporterIndex=null,centerSupporterIndex=-1;
function show(i){
  nodes.forEach(n=>n.classList.remove('active')); nodes[i].classList.add('active');
  const s=supporters[i]; nameEl.textContent=s.name; timeEl.textContent=`${s.year} · ${s.time}`;
  noteEl.textContent=s.note||'这位支持者留下了一份安静的鼓励 ✦'; noteEl.classList.toggle('empty',!s.note);
}
function selectSupporter(i){
  selectedSupporterIndex=i;
  show(i);
}
function refreshCenterSupporter(i){
  if(selectedSupporterIndex!==null||i===centerSupporterIndex)return;
  centerSupporterIndex=i;
  if(i>=0)show(i);
}
let bubbleClockSecond='',bubbleShown=new Set();
function supportMinuteSecond(value){
  const match=String(value).match(/(\d{1,2}):(\d{1,2}):(\d{1,2})$/);
  return match?`${String(+match[2]).padStart(2,'0')}:${String(+match[3]).padStart(2,'0')}`:'';
}
function showSupporterBubble(i){
  const supporter=supporters[i],node=nodes[i];
  const previous=node.querySelector('.supporter-bubble');
  if(previous)previous.remove();
  const bubble=document.createElement('span');
  bubble.className='supporter-bubble';
  bubble.textContent=supporter.note;
  node.appendChild(bubble);
  requestAnimationFrame(()=>bubble.classList.add('visible'));
  setTimeout(()=>{
    bubble.classList.remove('visible');
    setTimeout(()=>bubble.remove(),200);
  },3000);
}
function checkTimedNoteBubbles(){
  const now=new Date();
  const clockSecond=`${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}`;
  if(clockSecond!==bubbleClockSecond){
    bubbleClockSecond=clockSecond;
    bubbleShown=new Set();
  }
  const minuteSecond=`${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  supporters.forEach((supporter,i)=>{
    if(!String(supporter.note||'').trim()||supportMinuteSecond(supporter.time)!==minuteSecond||bubbleShown.has(i))return;
    // z2 大于 0.55 代表昵称位于面向用户的球体前部。
    if(Number(nodes[i].dataset.frontZ)>0.55){
      bubbleShown.add(i);
      showSupporterBubble(i);
    }
  });
}
function showRandomFrontBubble(){
  const candidates=supporters.map((supporter,i)=>({supporter,i})).filter(({supporter,i})=>
    String(supporter.note||'').trim()&&Number(nodes[i].dataset.frontZ)>.55
  );
  if(candidates.length){
    const picked=candidates[Math.floor(Math.random()*candidates.length)];
    showSupporterBubble(picked.i);
  }
}
// 保留按打赏时分秒触发的冒泡；以下五组定时器补足留言较少时的展示频率。
[5000,8000,10000,12000,15000].forEach(interval=>setInterval(()=>{
  if(!document.hidden)showRandomFrontBubble();
},interval));
function render(){
  const w=globe.clientWidth, R=w*.54*scale, ax=rx*Math.PI/180, ay=ry*Math.PI/180;
  let nearestCenter=-1,nearestCenterDistance=Infinity;
  nodes.forEach((el,i)=>{
    let x=+el.dataset.x,y=+el.dataset.y,z=+el.dataset.z;
    let x1=x*Math.cos(ay)+z*Math.sin(ay), z1=-x*Math.sin(ay)+z*Math.cos(ay);
    let y1=y*Math.cos(ax)-z1*Math.sin(ax), z2=y*Math.sin(ax)+z1*Math.cos(ax);
    const depth=(z2+1)/2, sc=.62+depth*.62;
    el.style.transform=`translate(-50%,-50%) translate(${x1*R}px,${y1*R}px) scale(${sc})`;
    el.style.opacity=.18+depth*.82; el.style.zIndex=Math.floor(depth*100);
    el.dataset.frontZ=String(z2);
    // 只从前半球选择投影到球心最近的昵称，作为未定位时的信息卡内容。
    if(z2>0){
      const distance=x1*x1+y1*y1;
      if(distance<nearestCenterDistance){nearestCenterDistance=distance;nearestCenter=i}
    }
  });
  refreshCenterSupporter(nearestCenter);
  checkTimedNoteBubbles();
}
const touches=new Map();
let pinchStartDist=0,pinchStartScale=1;
globe.onpointerdown=e=>{
  globe.setPointerCapture(e.pointerId);
  if(e.pointerType==='touch'){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(touches.size===2){
      pinchUsed=true;
      const a=[...touches.values()];
      pinchStartDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      pinchStartScale=scale;
      drag=false;pauseAuto();
      return;
    }
  }
  drag=true;pauseAuto();lx=e.clientX;ly=e.clientY;
};
globe.onpointermove=e=>{
  if(e.pointerType==='touch'&&touches.has(e.pointerId)){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(touches.size===2){
      const a=[...touches.values()];
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinchStartDist>0)scale=Math.max(.72,Math.min(1.65,pinchStartScale*d/pinchStartDist));
      render();return;
    }
  }
  if(!drag)return;
  const k=e.pointerType==='touch'?.24:.35;
  // 拖动方向与鼠标/手指保持一致，并限制纬向角度以避免上下颠倒。
  const horizontalDelta=e.clientX-lx;
  if(horizontalDelta)sphereTurnDirection=Math.sign(horizontalDelta);
  ry+=horizontalDelta*k;
  rx=Math.max(-89.5,Math.min(89.5,rx-(e.clientY-ly)*(e.pointerType==='touch'?.18:.25)));
  lx=e.clientX;ly=e.clientY;render();
};
function endPointer(e){
  if(e.pointerType==='touch'){
    touches.delete(e.pointerId);
    if(touches.size<2)pinchStartDist=0;
    if(touches.size===1){
      const a=[...touches.values()][0];lx=a.x;ly=a.y;drag=true;
    }else drag=false;
  }else drag=false;
  if(!drag&&touches.size===0)startAutoRotation();
}
globe.onpointerup=endPointer;
globe.onpointercancel=endPointer;

let lastTap=0,tapStart=null,pinchUsed=false;
globe.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch'){
  if(touches.size>=2)pinchUsed=true;
  else tapStart={x:e.clientX,y:e.clientY,t:Date.now()};
 }
},true);
globe.addEventListener('pointerup',e=>{
 if(e.pointerType!=='touch')return;
 // 双指缩放结束时只保留当前 scale，不参与“双击恢复”判断
 if(pinchUsed){
  if(touches.size<=1)pinchUsed=false;
  lastTap=0;tapStart=null;
  return;
 }
 if(!tapStart)return;
 const moved=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y);
 const now=Date.now();
 if(moved<12&&now-tapStart.t<260){
  if(lastTap&&now-lastTap<320){scale=1.08;render();lastTap=0}
  else lastTap=now;
 }
 tapStart=null;
});

globe.onwheel=e=>{e.preventDefault();pauseAuto();scale=Math.max(.72,Math.min(1.65,scale-e.deltaY*.0007));render();startAutoRotation()};
let lastGlobeRender=0;
function tick(frameTime){
  if(auto){
    const target=timeOrientation(Date.now());
    const autoDelta=shortestAngleDelta(lastAutoRy,target.ry);
    if(Math.abs(autoDelta)>.001)sphereTurnDirection=Math.sign(autoDelta);
    lastAutoRy=target.ry;
    const progress=autoBlendStarted?Math.min(1,(frameTime-autoBlendStarted)/AUTO_BLEND_DURATION):1;
    if(progress<1){
      const eased=1-Math.pow(1-progress,3);
      rx=autoBlendFrom.rx+shortestAngleDelta(autoBlendFrom.rx,target.rx)*eased;
      ry=autoBlendFrom.ry+shortestAngleDelta(autoBlendFrom.ry,target.ry)*eased;
    }else{
      rx=target.rx;ry=target.ry;autoBlendStarted=0;
    }
  }
  // 小屏限制为 30fps；拖动和缩放仍会立即调用 render()，不牺牲操作反馈。
  const frameInterval=matchMedia('(max-width:850px)').matches?1000/24:0;
  if(frameTime-lastGlobeRender>=frameInterval){
    render();lastGlobeRender=frameTime;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);


// search & locate
const searchInput=document.getElementById('searchInput');
const searchBtn=document.getElementById('searchBtn');
const searchResults=document.getElementById('searchResults');
function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,char=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[char]);
}
function runSearch(){
  const q=searchInput.value.trim().toLowerCase();
  if(!q){searchResults.style.display='none';return}
  const hits=supporters.map((s,i)=>({s,i})).filter(({s})=>
    String(s.year).includes(q)||s.time.toLowerCase().includes(q)||
    s.name.toLowerCase().includes(q)||(s.note||'').toLowerCase().includes(q)
  ).slice(0,12);
  searchResults.innerHTML=hits.length?hits.map(({s,i})=>
    `<div class="result" data-i="${i}"><b>${escapeHtml(s.name)}</b><em>${escapeHtml(s.year)} · ${escapeHtml(s.time)}</em><div>${escapeHtml(s.note||'无留言')}</div></div>`
  ).join(''):'<div class="result">没有找到匹配的支持者</div>';
  searchResults.style.display='block';
  searchResults.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i; const n=nodes[i];
    const x=+n.dataset.x,z=+n.dataset.z;
    ry=Math.atan2(-x,z)*180/Math.PI;
    rx=0; selectSupporter(i); render();
    searchResults.style.display='none';
    pauseAutoFor(10000);
  });
}
searchInput.addEventListener('input',runSearch);
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});
searchBtn.onclick=runSearch;
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.searchbox'))searchResults.style.display='none'});
document.addEventListener('click',event=>{
  if(!auto&&!drag&&touches.size===0&&!event.target.closest('.card,.person'))startAutoRotation();
});

// starfield
const c=document.getElementById('stars'),ctx=c.getContext('2d');let stars=[];
function canvasPixelRatio(){return Math.min(devicePixelRatio||1,isMobile()?1.5:2)}
function isMobile(){return matchMedia('(max-width:850px)').matches}
function resize(){
  const ratio=canvasPixelRatio();
  c.width=innerWidth*ratio;c.height=innerHeight*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);
  stars=Array.from({length:isMobile()?55:180},()=>({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+.2,
    a:Math.random(),color:Math.random()>.72?'#ff67ca':'#58f6ff'
  }));
}
addEventListener('resize',resize);resize();
let lastStarFrame=0;
(function draw(frameTime){
  const interval=isMobile()?1000/20:0;
  if(frameTime-lastStarFrame>=interval){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for(const s of stars){s.a+=.008;ctx.globalAlpha=.2+Math.abs(Math.sin(s.a))*.65;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
    lastStarFrame=frameTime;
  }
  requestAnimationFrame(draw)
})(0);

// supporter meteor rain
// 只比较打赏记录末尾的“时:分:秒”。例如记录为 2026 3/15 20:57:09，
// 那么现实时间每天到达 20:57:09 时，都会出现这位支持者对应的流星。
const mc=document.getElementById('meteors'),mx=mc.getContext('2d');
let meteors=[];
let lastMeteorSecond='';

function resizeMeteor(){
  const ratio=canvasPixelRatio();
  mc.width=innerWidth*ratio;
  mc.height=innerHeight*ratio;
  mx.setTransform(ratio,0,0,ratio,0,0);
}
addEventListener('resize',resizeMeteor);
resizeMeteor();

function pad2(n){return String(n).padStart(2,'0')}
function currentTimeKey(){
  const d=new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}
function normalizeSupportTime(t){
  // 数据里既有 8:51:50，也有 08:51:50，只提取并统一末尾的时分秒。
  const m=String(t).match(/(?:^|\s)(\d{1,2}):(\d{1,2}):(\d{1,2})$/);
  if(!m)return String(t);
  return `${pad2(+m[1])}:${pad2(+m[2])}:${pad2(+m[3])}`;
}
function spawnSupporterMeteor(s){
  // 流星沿球体的横向转动方向穿过屏幕：左上→右下或右上→左下。
  const entersFromLeft=sphereTurnDirection>0;
  const startRange=entersFromLeft?[.05,.30]:[.70,.95];
  const endRange=entersFromLeft?[.70,.95]:[.05,.30];
  const randomInRange=range=>innerWidth*(range[0]+Math.random()*(range[1]-range[0]));
  meteors.push({
    startX:randomInRange(startRange),
    startY:-innerHeight*.08-Math.random()*innerHeight*.12,
    endX:randomInRange(endRange),
    endY:innerHeight*1.08+Math.random()*innerHeight*.12,
    x:0,y:0,
    progress:0,
    duration:15000+Math.random()*5000,
    name:s.name,
    note:s.note||'',
    year:s.year,
    time:s.time,
    hue:supporterColor(s)
  });
  activateAudio().then(()=>playMeteorSound(s)).catch(()=>{});
}
function checkTimedMeteors(){
  const key=currentTimeKey();
  if(key===lastMeteorSecond)return;
  lastMeteorSecond=key;
  supporters.forEach(s=>{
    if(normalizeSupportTime(s.time)===key) spawnSupporterMeteor(s);
  });
}
let lastMeteorFrame=0;
function meteorFrame(frameTime){
  checkTimedMeteors();
  // 没有流星时只低频检查时间，避免透明画布在移动端持续以 60fps 清屏。
  const frameInterval=meteors.length?(isMobile()?1000/30:0):250;
  if(frameTime-lastMeteorFrame<frameInterval){
    requestAnimationFrame(meteorFrame);
    return;
  }
  const delta=Math.min(80,frameTime-lastMeteorFrame||16.67);
  lastMeteorFrame=frameTime;
  mx.clearRect(0,0,innerWidth,innerHeight);

  meteors.forEach(m=>{
    m.progress=Math.min(1,m.progress+delta/m.duration);
    // ease-out 让流星开始时更有速度感，末端自然收束。
    const progress=1-Math.pow(1-m.progress,1.15);
    m.x=m.startX+(m.endX-m.startX)*progress;
    m.y=m.startY+(m.endY-m.startY)*progress;

    const fadeIn=Math.min(1,m.progress/.06);
    const fadeOut=Math.max(0,1-(m.progress-.78)/.22);
    const a=fadeIn*fadeOut;

    const dx=m.endX-m.startX,dy=m.endY-m.startY;
    const mag=Math.hypot(dx,dy),ux=dx/mag,uy=dy/mag;
    const len=Math.min(240,110+mag*.12);
    const g=mx.createLinearGradient(m.x,m.y,m.x-ux*len,m.y-uy*len);
    g.addColorStop(0,m.hue+'f2');
    g.addColorStop(.16,m.hue+'82');
    g.addColorStop(.48,m.hue+'28');
    g.addColorStop(1,m.hue+'00');

    mx.globalAlpha=a;
    mx.strokeStyle=g;
    mx.lineWidth=1.8;
    mx.beginPath();
    mx.moveTo(m.x,m.y);
    mx.lineTo(m.x-ux*len,m.y-uy*len);
    mx.stroke();

    mx.shadowBlur=18;
    mx.shadowColor=m.hue;
    mx.fillStyle='#eaffff';
    mx.beginPath();
    mx.arc(m.x,m.y,2.1,0,Math.PI*2);
    mx.fill();
    mx.shadowBlur=0;

    mx.font='700 12px "Microsoft YaHei",sans-serif';
    mx.fillStyle=m.hue;
    mx.fillText(m.name,m.x+12,m.y-8);
  });

  mx.globalAlpha=1;
  meteors=meteors.filter(m=>m.progress<1);
  requestAnimationFrame(meteorFrame);
}
requestAnimationFrame(meteorFrame);

</script>
</body></html>
