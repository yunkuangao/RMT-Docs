<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>若梦兔 RMT · 支持者星空</title>
<style>
:root{--bg:#071008;--cyan:#4ffcff;--purple:#7cff8b;--pink:#ff65c8;--text:#f7ffe9;--muted:#9caf86}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:
linear-gradient(118deg,transparent 28%,rgba(95,255,230,.035) 44%,rgba(255,100,205,.045) 51%,transparent 67%),
radial-gradient(circle at 50% 48%,rgba(50,255,200,.10),transparent 35%),
radial-gradient(circle at 15% 20%,rgba(61,255,143,.10),transparent 28%),
radial-gradient(circle at 85% 80%,rgba(255,72,190,.09),transparent 30%);pointer-events:none}
#stars,#meteors{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#stars{opacity:.72}#meteors{z-index:1}
.wrap{position:relative;height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:26px 36px;z-index:2}
header{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#57ffe1,#70ff94 52%,#ff65c8);color:#14200a;box-shadow:0 0 35px #49ffd655}
h1{font-size:18px;margin:0;letter-spacing:2px}.sub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:3px}
.stats{font-size:12px;color:#a9bdd6;background:#ffffff08;border:1px solid #ffffff14;padding:10px 14px;border-radius:999px;backdrop-filter:blur(12px)}
.stage{position:relative;display:grid;place-items:center;min-height:0}
.orbit{position:absolute;width:min(70vw,70vh);aspect-ratio:1;border-radius:50%;border:1px solid #55ffe51d;box-shadow:inset 0 0 90px #4fffd009,0 0 90px #ff5ac80c}
.orbit:before,.orbit:after{content:"";position:absolute;inset:8%;border:1px solid #ff67cb18;border-radius:50%;transform:rotateX(68deg)}
.orbit:after{transform:rotateY(68deg)}
.globe{position:relative;width:min(82vw,82vh);aspect-ratio:1;perspective:900px;cursor:grab;user-select:none;touch-action:none}
.globe:active{cursor:grabbing}.sphere{position:absolute;inset:0;transform-style:preserve-3d}
.person{position:absolute;left:50%;top:50%;transform-style:preserve-3d;white-space:nowrap;font-size:12px;font-weight:700;letter-spacing:.4px;color:#dcecff;text-shadow:0 0 12px #58ffe680;transition:color .25s,text-shadow .25s,opacity .25s}
.person.active{color:#fff;text-shadow:0 0 8px #fff,0 0 22px var(--cyan),0 0 42px var(--purple);font-size:16px;z-index:10}
.core{position:absolute;left:50%;top:50%;width:145px;height:145px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#dfffff,#64ecff 15%,#785dff 42%,#1c155d 65%,#050713 73%);box-shadow:0 0 25px #6cf,0 0 80px #7a5fff99,0 0 150px #ff64c933;animation:pulse 3s ease-in-out infinite;pointer-events:none}
.core:after{content:"RMT";position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:1000;letter-spacing:4px;color:white;text-shadow:0 0 20px #fff}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06);filter:hue-rotate(20deg)}}
.card{position:fixed;right:28px;bottom:28px;top:auto;transform:none;width:min(370px,calc(100vw - 40px));z-index:8;padding:22px;border-radius:22px;background:linear-gradient(135deg,#10172dcc,#0b0d1ecc);border:1px solid #58ffe228;box-shadow:0 20px 70px #0008, inset 0 0 35px #58ffe208;backdrop-filter:blur(18px)}
.card .tag{font-size:10px;letter-spacing:3px;color:var(--cyan)}.card h2{font-size:28px;margin:10px 0 4px}.time{font-size:12px;color:var(--muted)}
.note{margin-top:18px;min-height:76px;font-size:16px;line-height:1.7;color:#dfeaff;padding:15px;border-radius:14px;background:#ffffff07;border-left:2px solid var(--cyan)}
.note.empty{color:#64758e;font-style:italic}
footer{display:flex;justify-content:center;color:#62738d;font-size:11px;letter-spacing:1px;padding-bottom:3px}
.hint{position:absolute;left:3%;top:50%;transform:translateY(-50%);font-size:11px;color:#687c99;line-height:2}
@media(max-width:850px){.wrap{padding:18px}.card{right:14px;bottom:14px;top:auto;transform:none;width:min(92vw,420px)}.globe{width:min(88vw,55vh)}.hint{display:none}.stats{display:none}}

.stage:before,.stage:after{content:"";position:absolute;left:50%;top:50%;width:min(76vw,76vh);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) rotate(-12deg) scaleY(.27);border:1px solid #54ffe520;box-shadow:0 0 35px #4fffe00a;pointer-events:none}
.stage:after{width:min(68vw,68vh);transform:translate(-50%,-50%) rotate(37deg) scaleY(.18);border-color:#ff64ca20}
.person:after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:#55ffe0;left:-8px;top:50%;box-shadow:0 0 9px #4dffdc}


.searchbox{position:relative;display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:17px}
.searchbox input{min-width:0;border:1px solid #62ffe12b;background:#06120fd9;color:#eaffff;padding:11px 12px;border-radius:12px;outline:none;font-size:12px;box-shadow:inset 0 0 18px #43ffd608}
.searchbox input:focus{border-color:#5affe18a;box-shadow:0 0 20px #45ffd31c,inset 0 0 18px #43ffd608}
.searchbox button{border:1px solid #ff69c83d;background:linear-gradient(135deg,#40dcb522,#ff5fc622);color:#eaffff;border-radius:12px;padding:0 14px;cursor:pointer}
.searchResults{position:absolute;left:0;right:0;top:48px;max-height:210px;overflow:auto;background:#06100ff2;border:1px solid #58ffe22e;border-radius:13px;backdrop-filter:blur(18px);display:none;z-index:30;box-shadow:0 18px 50px #000b}
.result{padding:10px 12px;border-bottom:1px solid #ffffff0b;cursor:pointer;font-size:11px;color:#b8d8d2}
.result:hover{background:#53ffda12;color:#fff}.result b{color:#63ffe1;font-size:12px}.result em{color:#ff78cf;font-style:normal;margin-left:7px}
#stars{filter:drop-shadow(0 0 3px #58ffe266)}





/* ===== Mobile optimization ===== */
@media(max-width:850px){
 html,body{overflow:hidden;height:100%;height:100dvh}
 .wrap{height:100vh;height:100dvh;padding:12px 14px;grid-template-rows:auto 1fr}
 header{align-items:flex-start}
 .brand{gap:9px}.logo{width:36px;height:36px;border-radius:11px;font-size:13px}
 h1{font-size:14px;letter-spacing:1px}.sub{font-size:8px;letter-spacing:1.4px;margin-top:2px}
 .stats{display:none}
 .stage{min-height:0;overflow:visible}
 .globe{width:min(112vw,68dvh);height:min(112vw,68dvh);position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);perspective:700px}
 .orbit{width:min(116vw,70dvh);left:50%;top:42%;transform:translate(-50%,-50%)}
 .stage:before,.stage:after{left:50%;top:42%;width:min(118vw,72dvh)}
 .person{font-size:10px;text-shadow:0 0 8px #58ffe680}
 .person.active{font-size:13px}
 .card{position:fixed;left:12px;right:12px;bottom:12px;width:auto;max-height:35dvh;padding:13px 14px;border-radius:16px;overflow:visible}
 .card .tag{font-size:8px;letter-spacing:2px}
 .card h2{font-size:20px;margin:7px 0 2px}
 .time{font-size:10px}.note{margin-top:9px;min-height:0;max-height:70px;overflow:auto;font-size:12px;line-height:1.5;padding:9px 10px;border-radius:10px}
 .searchbox{margin-bottom:10px;gap:6px}.searchbox input{padding:9px 10px;font-size:11px}.searchbox button{padding:0 11px}
 .searchResults{top:auto;bottom:43px;max-height:31dvh}.result{padding:8px 10px;font-size:10px}.result b{font-size:11px}
 footer{display:none}
}
@media(max-width:430px){
 .globe{width:min(122vw,64dvh);height:min(122vw,64dvh);top:40%}
 .orbit{width:min(126vw,66dvh);top:40%}
 .stage:before,.stage:after{width:min(128vw,68dvh);top:40%}
 .card{left:9px;right:9px;bottom:max(9px,env(safe-area-inset-bottom));padding:11px 12px}
 .note{max-height:58px}
}
@media(max-height:650px) and (max-width:850px){
 .sub{display:none}.logo{width:32px;height:32px}.globe{top:37%;width:min(100vw,61dvh);height:min(100vw,61dvh)}
 .orbit,.stage:before,.stage:after{top:37%}.card{max-height:38dvh}.note{max-height:45px}
}

</style>
</head>
<body>
<canvas id="stars"></canvas><canvas id="meteors"></canvas>
<div class="wrap">
<header><div class="brand"><div class="logo">兔</div><div><h1>若梦兔 RMT · 支持者星空</h1><div class="sub">EVERY SUPPORT BECOMES A STAR</div></div></div><div class="stats" id="stats"></div></header>
<main class="stage">
<div class="orbit"></div>
<div class="globe" id="globe"><div class="sphere" id="sphere"></div></div>
<aside class="card">
<div class="searchbox">
  <input id="searchInput" placeholder="搜索时间 / 名称 / 留言…" autocomplete="off">
  <button id="searchBtn">定位</button>
  <div id="searchResults" class="searchResults"></div>
</div>
<div class="tag">SUPPORTER SIGNAL</div><h2 id="name">感谢每一位支持者</h2><div class="time" id="time">RMT · SUPPORTER CONSTELLATION</div><div class="note" id="note">每一份支持，都让若梦兔走得更远。</div></aside>
</main>
<footer>RMT · 若梦兔 · 开源因热爱而开始，也因大家的支持走得更远</footer>
</div>
<script src="./supporters-data.js"></script>
<script>
// ============================================================
// 支持者名单由 supporters-data.js 提供，页面表现与数据分开维护。
// ============================================================
const supporters = Array.isArray(window.RMT_SUPPORTERS) ? window.RMT_SUPPORTERS : [];
// ============================================================

const sphere=document.getElementById('sphere'), globe=document.getElementById('globe');
const nameEl=document.getElementById('name'),timeEl=document.getElementById('time'),noteEl=document.getElementById('note');
document.getElementById('stats').textContent=`${supporters.length} 份支持 · 2025 — 2026`;

let rx=-8,ry=0,scale=1.08,drag=false,lx=0,ly=0,auto=true;
const nodes=[], N=supporters.length;
supporters.forEach((s,i)=>{
  const el=document.createElement('div'); el.className='person'; el.textContent=s.name;
  const y=1-(i/(Math.max(1,N-1)))*2, radius=Math.sqrt(1-y*y), theta=Math.PI*(3-Math.sqrt(5))*i;
  el.dataset.x=Math.cos(theta)*radius; el.dataset.y=y; el.dataset.z=Math.sin(theta)*radius;
  el.onmouseenter=()=>{auto=false;show(i)}; el.onmouseleave=()=>auto=true;
  el.onclick=()=>show(i); sphere.appendChild(el); nodes.push(el);
});
function show(i){
  nodes.forEach(n=>n.classList.remove('active')); nodes[i].classList.add('active');
  const s=supporters[i]; nameEl.textContent=s.name; timeEl.textContent=`${s.year} · ${s.time}`;
  noteEl.textContent=s.note||'这位支持者留下了一份安静的鼓励 ✦'; noteEl.classList.toggle('empty',!s.note);
}
function render(){
  const w=globe.clientWidth, R=w*.54*scale, ax=rx*Math.PI/180, ay=ry*Math.PI/180;
  let front=-1, frontZ=-9;
  nodes.forEach((el,i)=>{
    let x=+el.dataset.x,y=+el.dataset.y,z=+el.dataset.z;
    let x1=x*Math.cos(ay)+z*Math.sin(ay), z1=-x*Math.sin(ay)+z*Math.cos(ay);
    let y1=y*Math.cos(ax)-z1*Math.sin(ax), z2=y*Math.sin(ax)+z1*Math.cos(ax);
    const depth=(z2+1)/2, sc=.62+depth*.62;
    el.style.transform=`translate(-50%,-50%) translate(${x1*R}px,${y1*R}px) scale(${sc})`;
    el.style.opacity=.18+depth*.82; el.style.zIndex=Math.floor(depth*100);
    if(z2>frontZ){frontZ=z2;front=i}
  });
  if(auto && front>=0 && Math.floor(ry)%7===0) show(front);
}
const touches=new Map();
let pinchStartDist=0,pinchStartScale=1;
globe.onpointerdown=e=>{
  globe.setPointerCapture(e.pointerId);
  if(e.pointerType==='touch'){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(touches.size===2){
      pinchUsed=true;
      const a=[...touches.values()];
      pinchStartDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      pinchStartScale=scale;
      drag=false;auto=false;
      return;
    }
  }
  drag=true;auto=false;lx=e.clientX;ly=e.clientY;
};
globe.onpointermove=e=>{
  if(e.pointerType==='touch'&&touches.has(e.pointerId)){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(touches.size===2){
      const a=[...touches.values()];
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinchStartDist>0)scale=Math.max(.72,Math.min(1.65,pinchStartScale*d/pinchStartDist));
      render();return;
    }
  }
  if(!drag)return;
  const k=e.pointerType==='touch'?.24:.35;
  ry+=(e.clientX-lx)*k;rx-=(e.clientY-ly)*(e.pointerType==='touch'?.18:.25);
  lx=e.clientX;ly=e.clientY;render();
};
function endPointer(e){
  if(e.pointerType==='touch'){
    touches.delete(e.pointerId);
    if(touches.size<2)pinchStartDist=0;
    if(touches.size===1){
      const a=[...touches.values()][0];lx=a.x;ly=a.y;drag=true;
    }else drag=false;
  }else drag=false;
  setTimeout(()=>{if(!drag&&touches.size===0)auto=true},1200);
}
globe.onpointerup=endPointer;
globe.onpointercancel=endPointer;

let lastTap=0,tapStart=null,pinchUsed=false;
globe.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch'){
  if(touches.size>=2)pinchUsed=true;
  else tapStart={x:e.clientX,y:e.clientY,t:Date.now()};
 }
},true);
globe.addEventListener('pointerup',e=>{
 if(e.pointerType!=='touch')return;
 // 双指缩放结束时只保留当前 scale，不参与“双击恢复”判断
 if(pinchUsed){
  if(touches.size<=1)pinchUsed=false;
  lastTap=0;tapStart=null;
  return;
 }
 if(!tapStart)return;
 const moved=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y);
 const now=Date.now();
 if(moved<12&&now-tapStart.t<260){
  if(lastTap&&now-lastTap<320){scale=1.08;render();lastTap=0}
  else lastTap=now;
 }
 tapStart=null;
});

globe.onwheel=e=>{e.preventDefault();scale=Math.max(.72,Math.min(1.65,scale-e.deltaY*.0007));render()};
function tick(){if(auto)ry+=.055;render();requestAnimationFrame(tick)} tick();


// search & locate
const searchInput=document.getElementById('searchInput');
const searchBtn=document.getElementById('searchBtn');
const searchResults=document.getElementById('searchResults');
function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,char=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[char]);
}
function runSearch(){
  const q=searchInput.value.trim().toLowerCase();
  if(!q){searchResults.style.display='none';return}
  const hits=supporters.map((s,i)=>({s,i})).filter(({s})=>
    String(s.year).includes(q)||s.time.toLowerCase().includes(q)||
    s.name.toLowerCase().includes(q)||(s.note||'').toLowerCase().includes(q)
  ).slice(0,12);
  searchResults.innerHTML=hits.length?hits.map(({s,i})=>
    `<div class="result" data-i="${i}"><b>${escapeHtml(s.name)}</b><em>${escapeHtml(s.year)} · ${escapeHtml(s.time)}</em><div>${escapeHtml(s.note||'无留言')}</div></div>`
  ).join(''):'<div class="result">没有找到匹配的支持者</div>';
  searchResults.style.display='block';
  searchResults.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i; const n=nodes[i];
    const x=+n.dataset.x,z=+n.dataset.z;
    ry=Math.atan2(-x,z)*180/Math.PI;
    rx=0; auto=false; show(i); render();
    searchResults.style.display='none';
    setTimeout(()=>auto=true,2600);
  });
}
searchInput.addEventListener('input',runSearch);
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});
searchBtn.onclick=runSearch;
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.searchbox'))searchResults.style.display='none'});

// starfield
const c=document.getElementById('stars'),ctx=c.getContext('2d');let stars=[];
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);stars=Array.from({length:180},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+.2,a:Math.random()}))}
addEventListener('resize',resize);resize();
(function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const s of stars){s.a+=.008;ctx.globalAlpha=.2+Math.abs(Math.sin(s.a))*.65;ctx.fillStyle=Math.random()>.72?'#ff67ca':'#58f6ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}requestAnimationFrame(draw)})();

// supporter anniversary meteor rain
// 只有当前“月/日 时:分:秒”与支持记录完全重合时才触发。
// 年份不参与匹配：例如 2025 年 5/12 21:33:06 的支持者，
// 在以后每年的 5/12 21:33:06 都会作为纪念流星再次划过。
const mc=document.getElementById('meteors'),mx=mc.getContext('2d');
let meteors=[];
let lastMeteorSecond='';

function resizeMeteor(){
  mc.width=innerWidth*devicePixelRatio;
  mc.height=innerHeight*devicePixelRatio;
  mx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener('resize',resizeMeteor);
resizeMeteor();

function pad2(n){return String(n).padStart(2,'0')}
function currentTimeKey(){
  const d=new Date();
  return `${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}
function normalizeSupportTime(t){
  // 数据里既有 8:51:50，也有 08:51:50，这里统一成 H:mm:ss 形式进行比较。
  const m=String(t).match(/^(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{1,2}):(\d{1,2})$/);
  if(!m)return String(t);
  return `${+m[1]}/${+m[2]} ${pad2(+m[3])}:${pad2(+m[4])}:${pad2(+m[5])}`;
}
function spawnSupporterMeteor(s){
  // 多人在同一秒打赏时，会从略微不同的位置依次划过。
  meteors.push({
    x:innerWidth*(.68+Math.random()*.38),
    y:-45-Math.random()*90,
    vx:-0.72-Math.random()*.42,
    vy:1.12+Math.random()*.55,
    life:0,
    max:420+Math.random()*130,
    name:s.name,
    note:s.note||'',
    year:s.year,
    time:s.time,
    hue:Math.random()>.42?'#5effd7':'#ff65c8'
  });
}
function checkTimedMeteors(){
  const key=currentTimeKey();
  if(key===lastMeteorSecond)return;
  lastMeteorSecond=key;
  supporters.forEach(s=>{
    if(normalizeSupportTime(s.time)===key) spawnSupporterMeteor(s);
  });
}
function meteorFrame(){
  checkTimedMeteors();
  mx.clearRect(0,0,innerWidth,innerHeight);

  meteors.forEach(m=>{
    m.x+=m.vx;
    m.y+=m.vy;
    m.life++;

    const fadeIn=Math.min(1,m.life/30);
    const fadeOut=Math.max(0,1-m.life/m.max);
    const a=fadeIn*fadeOut;

    const mag=Math.hypot(m.vx,m.vy),ux=m.vx/mag,uy=m.vy/mag;
    const len=150+mag*38;
    const g=mx.createLinearGradient(m.x,m.y,m.x-ux*len,m.y-uy*len);
    g.addColorStop(0,m.hue+'f2');
    g.addColorStop(.16,m.hue+'82');
    g.addColorStop(.48,m.hue+'28');
    g.addColorStop(1,m.hue+'00');

    mx.globalAlpha=a;
    mx.strokeStyle=g;
    mx.lineWidth=1.8;
    mx.beginPath();
    mx.moveTo(m.x,m.y);
    mx.lineTo(m.x-ux*len,m.y-uy*len);
    mx.stroke();

    mx.shadowBlur=18;
    mx.shadowColor=m.hue;
    mx.fillStyle='#eaffff';
    mx.beginPath();
    mx.arc(m.x,m.y,2.1,0,Math.PI*2);
    mx.fill();
    mx.shadowBlur=0;

    mx.font='700 12px "Microsoft YaHei",sans-serif';
    mx.fillStyle=m.hue;
    mx.fillText(m.name,m.x+12,m.y-8);
  });

  mx.globalAlpha=1;
  meteors=meteors.filter(m=>m.life<m.max && m.y<innerHeight+120 && m.x>-220);
  requestAnimationFrame(meteorFrame);
}
meteorFrame();

</script>
</body></html>
